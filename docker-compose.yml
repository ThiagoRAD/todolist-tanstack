version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: todolist-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: todolist
      POSTGRES_USER: todolist
      POSTGRES_PASSWORD: todolist
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
